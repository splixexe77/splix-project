# =============================================================
#  Render blueprint for the SPLIX X CHEAT site + unlock server
# -------------------------------------------------------------
#  The server is pure Python standard library — the build step only
#  installs requirements.txt (intentionally empty of packages).
#
#  Start command:   python server/run.py
#  Health check:    GET /health   (200 {"ok": true, ...})
#
#  NO SECRETS live in this file.  ADMIN_TOKEN is generated by Render
#  into its private environment; Google credentials and the Discord
#  webhook are added in the dashboard after the URL is assigned
#  (see server/README.md → "Production deployment").
#
#  IMPORTANT: the persistent disk below is what keeps links, sessions,
#  settings and the audit log across redeploys.  Without a disk the
#  data folder is EPHEMERAL and every deploy starts empty — never run
#  real data that way.
# =============================================================
services:
  - type: web
    name: splix-x-cheat
    runtime: python
    plan: starter          # a paid instance is required for the disk
    buildCommand: pip install -r server/requirements.txt
    startCommand: python server/run.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Generated and stored privately by Render — never in the repo.
      - key: ADMIN_TOKEN
        generateValue: true
      # Behind Render's HTTPS edge proxy: read the real client IP from
      # X-Forwarded-For (rightmost entry) and mark cookies Secure when
      # X-Forwarded-Proto says https.
      - key: TRUST_PROXY
        value: "true"
      # Persistent-disk mount (see the disk: block below).
      - key: DATA_DIR
        value: /var/data
      # Set this in the dashboard once the service URL exists, and keep
      # it updated if you attach a custom domain.  Until then the server
      # falls back to Render's RENDER_EXTERNAL_URL automatically.
      - key: PUBLIC_URL
        sync: false
      # Optional — configure in the dashboard after the URL is assigned:
      #   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, YOUTUBE_CHANNEL_ID,
      #   DISCORD_WEBHOOK_URL  (all secret, dashboard-only)
    # Singular "disk" block — the official Blueprint schema does not
    # accept a plural "disks" list for services.
    disk:
      name: splix-data
      mountPath: /var/data
      sizeGB: 1
